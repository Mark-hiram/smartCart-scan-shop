  <head>

    <script>
      // Gracefully handle iframe proxy WebSocket closure where HMR WebSocket is not forwarded
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes('WebSocket closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
