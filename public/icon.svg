<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#10B981" />
  <defs>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background subtle pattern -->
  <circle cx="256" cy="256" r="190" fill="#059669" opacity="0.4" />
  
  <!-- Barcode lines inside cart area -->
  <rect x="180" y="180" width="12" height="70" rx="3" fill="#ffffff" />
  <rect x="202" y="180" width="6" height="70" rx="2" fill="#ffffff" />
  <rect x="218" y="180" width="16" height="70" rx="3" fill="#ffffff" />
  <rect x="244" y="180" width="8" height="70" rx="2" fill="#ffffff" />
  <rect x="262" y="180" width="14" height="70" rx="3" fill="#ffffff" />
  <rect x="286" y="180" width="6" height="70" rx="2" fill="#ffffff" />
  <rect x="302" y="180" width="18" height="70" rx="3" fill="#ffffff" />
  <rect x="330" y="180" width="10" height="70" rx="3" fill="#ffffff" />
  
  <!-- Laser scanner beam -->
  <line x1="160" y1="215" x2="352" y2="215" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
  
  <!-- Cart body outline -->
  <path d="M130 140 H165 L195 290 H345 L375 190 H180" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M195 290 L180 340 H350" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wheels -->
  <circle cx="210" cy="380" r="22" fill="#FFFFFF" />
  <circle cx="320" cy="380" r="22" fill="#FFFFFF" />
  <circle cx="210" cy="380" r="10" fill="#10B981" />
  <circle cx="320" cy="380" r="10" fill="#10B981" />
</svg>
